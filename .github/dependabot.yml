version: 2
updates:
  # Keep the actions used in .github/workflows/ up to date
  # (e.g. astral-sh/setup-uv is pinned to an exact version).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Etc/UTC"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
