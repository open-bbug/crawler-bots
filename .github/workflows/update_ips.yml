name: Update Crawler Bot IPs

on:
  schedule:
    - cron: '0 0 * * 1'  # Every Monday at 00:00 UTC
  workflow_dispatch:      # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  update-ips:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          cache-dependency-glob: ""

      - name: Run update script
        id: update
        env:
          # Report of fetched / fallback / failed providers, also written to the job summary
          UPDATE_REPORT_PATH: ${{ runner.temp }}/update_report.md
        run: |
          {
            echo "Automated update of crawler bot IP whitelists."
            echo
            echo "This PR updates the IP lists in \`data/\` based on the latest data from providers."
            echo
          } > "$UPDATE_REPORT_PATH"
          # Exit code 2 = some providers were not updated; keep going so the PR
          # still gets the other updates, and fail the job in the last step.
          set +e
          uv run scripts/update_ips.py
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            exit "$code"
          fi

      - name: Check for changes
        id: git_diff
        run: |
          if [[ -n $(git status --porcelain data/) ]]; then
            echo "changes_detected=true" >> $GITHUB_OUTPUT
          else
            echo "changes_detected=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.git_diff.outputs.changes_detected == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update crawler bot IP whitelist"
          title: "chore: update crawler bot IP whitelist"
          body-path: ${{ runner.temp }}/update_report.md
          branch: update-crawler-ips
          delete-branch: true

      - name: Fail if any provider was not updated
        if: steps.update.outputs.exit_code == '2'
        run: |
          echo "::error title=Provider failures::Some providers could not be updated. See the job summary for details."
          exit 1
